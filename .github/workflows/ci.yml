name: Polyglot lambda core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TJSV_REVISION: 4740f1367a7906813dcd420a77d0c9ede26943fb

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install the repository contract toolchain
        run: npm ci --ignore-scripts
      - name: Preserve the repository-local deterministic cross-check
        run: npm run verify
      - name: Enforce peer TypeSpec and JSON Schema authorities with immutable TJSV
        uses: ORESoftware/typespec-json-schema-validator@4740f1367a7906813dcd420a77d0c9ede26943fb
        with:
          typespec: typespec/main.tsp
          schema: schema
          mapping: config/tjsv-declaration-mapping.json
          instances: fixtures
          report: .typespec-json-schema-validator/positive/report.json
          sarif: .typespec-json-schema-validator/positive/report.sarif
          contract_ir: .typespec-json-schema-validator/positive/contract-ir.json
          output_dir: .typespec-json-schema-validator/positive/generated
          max_probes: "64"
          seal_object_schemas: "true"
      - name: Require an admissible, peer-authority Contract IR
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const report = JSON.parse(await readFile('.typespec-json-schema-validator/positive/report.json', 'utf8'));
          const contractIr = JSON.parse(await readFile('.typespec-json-schema-validator/positive/contract-ir.json', 'utf8'));
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) {
            throw new Error('TJSV parity receipt is not a zero-finding pass');
          }
          if (contractIr.status !== 'passed' || contractIr.admissible !== true) {
            throw new Error('TJSV Contract IR is not admissible');
          }
          if (contractIr.authorities?.typespec !== 'independently-authored' ||
              contractIr.authorities?.jsonSchema !== 'independently-authored' ||
              contractIr.authorities?.generatedJsonSchema !== 'comparison-evidence-only' ||
              contractIr.authorities?.precedence !== 'none') {
            throw new Error('TJSV Contract IR changed the peer-authority boundary');
          }
          NODE
      - name: Prepare an intentional runtime-enum drift control
        run: |
          set -euo pipefail
          mkdir -p tmp/tjsv-negative
          cp -R schema tmp/tjsv-negative/schema
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'tmp/tjsv-negative/schema/Runtime.json';
          const schema = JSON.parse(await readFile(path, 'utf8'));
          schema.enum = schema.enum.filter((value) => value !== 'binary');
          await writeFile(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE
      - name: Prove TJSV fails closed on peer-authority drift
        id: negative-control
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@4740f1367a7906813dcd420a77d0c9ede26943fb
        with:
          typespec: typespec/main.tsp
          schema: tmp/tjsv-negative/schema
          mapping: config/tjsv-declaration-mapping.json
          instances: fixtures
          report: .typespec-json-schema-validator/negative/report.json
          sarif: .typespec-json-schema-validator/negative/report.sarif
          contract_ir: .typespec-json-schema-validator/negative/contract-ir.json
          output_dir: .typespec-json-schema-validator/negative/generated
          max_probes: "64"
          seal_object_schemas: "true"
      - name: Require a non-admissible negative-control tombstone
        env:
          NEGATIVE_CONTROL_OUTCOME: ${{ steps.negative-control.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          if (process.env.NEGATIVE_CONTROL_OUTCOME !== 'failure') {
            throw new Error(`intentional TJSV drift unexpectedly returned ${process.env.NEGATIVE_CONTROL_OUTCOME}`);
          }
          const report = JSON.parse(await readFile('.typespec-json-schema-validator/negative/report.json', 'utf8'));
          const contractIr = JSON.parse(await readFile('.typespec-json-schema-validator/negative/contract-ir.json', 'utf8'));
          if (report.status !== 'stopped_for_evaluation' || report.zeroUnexplainedFindings !== false || !report.findings?.length) {
            throw new Error('negative TJSV receipt did not retain discrepancy evidence');
          }
          if (contractIr.status !== 'stopped_for_evaluation' || contractIr.admissible !== false || contractIr.declarations?.length !== 0) {
            throw new Error('negative TJSV Contract IR was not a non-admissible tombstone');
          }
          NODE
      - name: Retain exact-source TJSV evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lambda-peer-authority-evidence
          path: .typespec-json-schema-validator/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  native:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, bun, deno, rust, go, erlang, gleam]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - if: matrix.language == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.1"
      - if: matrix.language == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.6"
      - if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.24.x"
      - if: matrix.language == 'erlang'
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: "29"
          rebar3-version: "3.27.0"
      - if: matrix.language == 'gleam'
        uses: erlef/setup-beam@8736e9244717f9207464c14c6051b71d22253f60
        with:
          otp-version: "29"
          gleam-version: "1.16.0"
      - if: matrix.language == 'rust'
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Test native target
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            typescript) (cd languages/typescript && npm test) ;;
            bun) (cd languages/bun && bun test) ;;
            deno) (cd languages/deno && deno test) ;;
            rust) (cd languages/rust && cargo +1.96.0 fmt --check && cargo +1.96.0 clippy --all-targets --locked -- -D warnings && cargo +1.96.0 test --locked) ;;
            go) (cd languages/go && test -z "$(gofmt -d .)" && go vet ./... && go test -race -cover ./...) ;;
            erlang) (cd languages/erlang && rebar3 compile && rebar3 eunit) ;;
            gleam) (cd languages/gleam && gleam format --check src test && gleam test) ;;
            *) exit 64 ;;
          esac
