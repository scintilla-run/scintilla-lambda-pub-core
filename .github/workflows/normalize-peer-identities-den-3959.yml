name: Normalize lambda peer identities for DEN-3959

on:
  push:
    branches:
      - DEN-3959/tjsv-public-lambda-core
    paths:
      - .github/workflows/normalize-peer-identities-den-3959.yml

permissions:
  contents: write

concurrency:
  group: normalize-lambda-peer-identities-den-3959
  cancel-in-progress: false

jobs:
  normalize-test-and-self-delete:
    if: github.repository == 'scintilla-run/scintilla-lambda-pub-core' && github.ref == 'refs/heads/DEN-3959/tjsv-public-lambda-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3959/tjsv-public-lambda-core
          fetch-depth: 0
          persist-credentials: true

      - name: Remove this bounded migration carrier
        run: rm -- .github/workflows/normalize-peer-identities-den-3959.yml

      - name: Normalize independently authored declaration identities
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { basename, join } from 'node:path';

          const typeSpecPath = 'typespec/main.tsp';
          let typeSpec = await readFile(typeSpecPath, 'utf8');
          const scalar = /(@minLength\(1\)\n@maxLength\(1024\)\n)(scalar LaunchArgument extends string;)/u;
          if (!scalar.test(typeSpec)) {
            throw new Error('LaunchArgument source shape changed; refuse an ambiguous migration');
          }
          typeSpec = typeSpec.replace(scalar, '$1@jsonSchema\n$2');
          await writeFile(typeSpecPath, typeSpec);

          const schemaDir = 'schema';
          const names = (await readdir(schemaDir))
            .filter((name) => name.endsWith('.json') && name !== 'index.json')
            .sort();

          for (const name of names) {
            const path = join(schemaDir, name);
            const document = JSON.parse(await readFile(path, 'utf8'));
            const identity = basename(name, '.json');
            const priorTitle = document.title;
            document.title = identity;
            if (!document.description && priorTitle && priorTitle !== identity) {
              document.description = priorTitle;
            }

            if (name === 'ContainerArtifact.json') {
              delete document.$defs;
              document.properties.entrypoint.items = { $ref: 'LaunchArgument.json' };
            }
            if (name === 'ExecutableArtifact.json') {
              delete document.$defs;
              document.properties.args.items = { $ref: 'LaunchArgument.json' };
            }
            await writeFile(path, `${JSON.stringify(document, null, 2)}\n`);
          }

          const launchArgument = {
            $schema: 'https://json-schema.org/draft/2020-12/schema',
            $id: 'https://scintilla.run/schemas/lambda/v1/LaunchArgument.json',
            title: 'LaunchArgument',
            description: 'One literal argv element passed to a container entrypoint or bare executable.',
            type: 'string',
            minLength: 1,
            maxLength: 1024,
          };
          await writeFile(
            join(schemaDir, 'LaunchArgument.json'),
            `${JSON.stringify(launchArgument, null, 2)}\n`,
          );

          const mappingPath = 'config/tjsv-declaration-mapping.json';
          const mapping = JSON.parse(await readFile(mappingPath, 'utf8'));
          for (const declaration of mapping.declarations) {
            declaration.authored = declaration.generated;
          }
          mapping.declarations.push({
            typespec: 'Scintilla.Lambda.V1.LaunchArgument',
            generated: 'LaunchArgument',
            authored: 'LaunchArgument',
          });
          mapping.declarations.sort((left, right) => left.typespec.localeCompare(right.typespec));
          mapping.ignore = {
            typespec: [],
            generated: [],
            authored: ['Scintilla lambda public core schema catalog'],
          };
          await writeFile(mappingPath, `${JSON.stringify(mapping, null, 2)}\n`);
          NODE

      - name: Install and run the repository-local complete verifier
        run: |
          npm ci --ignore-scripts
          npm run verify

      - name: Enforce the normalized peer authorities with immutable TJSV
        uses: ORESoftware/typespec-json-schema-validator@4740f1367a7906813dcd420a77d0c9ede26943fb
        with:
          typespec: typespec/main.tsp
          schema: schema
          mapping: config/tjsv-declaration-mapping.json
          instances: fixtures
          report: .typespec-json-schema-validator/migration/report.json
          sarif: .typespec-json-schema-validator/migration/report.sarif
          contract_ir: .typespec-json-schema-validator/migration/contract-ir.json
          output_dir: .typespec-json-schema-validator/migration/generated
          max_probes: '64'
          seal_object_schemas: 'true'

      - name: Require a zero-finding admissible result
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('.typespec-json-schema-validator/migration/report.json', 'utf8'));
          const contractIr = JSON.parse(await readFile('.typespec-json-schema-validator/migration/contract-ir.json', 'utf8'));
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true || report.findings.length !== 0) {
            throw new Error('normalized peer authorities did not produce a zero-finding TJSV receipt');
          }
          if (contractIr.status !== 'passed' || contractIr.admissible !== true) {
            throw new Error('normalized peer authorities did not produce an admissible Contract IR');
          }
          NODE

      - name: Commit only the verified peer-source and generated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            typespec/main.tsp \
            config/tjsv-declaration-mapping.json \
            schema \
            generated/json-schema \
            .github/workflows/normalize-peer-identities-den-3959.yml
          git diff --cached --check
          git commit -m 'fix(DEN-3959): normalize lambda peer declaration identities'
          git push origin HEAD:DEN-3959/tjsv-public-lambda-core
